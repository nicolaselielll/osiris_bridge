name: Build graph_watcher binaries

on:
  workflow_dispatch:   # run manually from the Actions tab
  push:
    branches: [main]   # the binaries are committed to main, so only main builds them
    paths:
      - 'graph_watcher/**'   # auto-run when source changes

permissions:
  contents: read

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build graph_watcher (x86_64)
        run: |
          source /opt/ros/humble/setup.bash
          BUILD_DIR=$(mktemp -d)
          cmake -S graph_watcher -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --parallel
          cp "$BUILD_DIR/graph_watcher" osiris_agent/bin/graph_watcher_x86_64
          chmod +x osiris_agent/bin/graph_watcher_x86_64
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph_watcher_x86_64
          path: osiris_agent/bin/graph_watcher_x86_64

  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build graph_watcher (aarch64)
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD/graph_watcher":/ws/src/graph_watcher:ro \
            -v "$PWD/osiris_agent/bin":/out \
            ros:humble-ros-base \
            bash -c '
              set -e
              source /opt/ros/humble/setup.bash
              cd /ws
              colcon build --packages-select graph_watcher \
                --cmake-args -DCMAKE_BUILD_TYPE=Release
              cp install/graph_watcher/lib/graph_watcher/graph_watcher /out/graph_watcher_aarch64
              chmod +x /out/graph_watcher_aarch64
            '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph_watcher_aarch64
          path: osiris_agent/bin/graph_watcher_aarch64

  # ROS2 distros are not binary-ABI-compatible with each other (rclcpp/rcutils
  # symbols can move between releases, so a Humble-linked binary fails on a
  # Jazzy system with "undefined symbol" errors for QOSEventHandlerBase and
  # rcutils_strnlen). The two jobs above are Humble builds, used as the
  # last-resort fallback candidate; these two build the real thing for Jazzy,
  # named graph_watcher_{arch}_jazzy to match graph_watcher_launcher.py's
  # distro-specific lookup so Jazzy robots get a binary actually linked
  # against Jazzy's rclcpp.
  build-x86_64-jazzy:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build graph_watcher (x86_64, jazzy)
        run: |
          source /opt/ros/jazzy/setup.bash
          BUILD_DIR=$(mktemp -d)
          cmake -S graph_watcher -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --parallel
          cp "$BUILD_DIR/graph_watcher" osiris_agent/bin/graph_watcher_x86_64_jazzy
          chmod +x osiris_agent/bin/graph_watcher_x86_64_jazzy
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph_watcher_x86_64_jazzy
          path: osiris_agent/bin/graph_watcher_x86_64_jazzy

  build-aarch64-jazzy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build graph_watcher (aarch64, jazzy)
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD/graph_watcher":/ws/src/graph_watcher:ro \
            -v "$PWD/osiris_agent/bin":/out \
            ros:jazzy-ros-base \
            bash -c '
              set -e
              source /opt/ros/jazzy/setup.bash
              cd /ws
              colcon build --packages-select graph_watcher \
                --cmake-args -DCMAKE_BUILD_TYPE=Release
              cp install/graph_watcher/lib/graph_watcher/graph_watcher /out/graph_watcher_aarch64_jazzy
              chmod +x /out/graph_watcher_aarch64_jazzy
            '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph_watcher_aarch64_jazzy
          path: osiris_agent/bin/graph_watcher_aarch64_jazzy

  commit-binaries:
    needs: [build-x86_64, build-aarch64, build-x86_64-jazzy, build-aarch64-jazzy]
    # A manual run from another branch still builds the binaries as
    # artifacts, but only main commits them.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graph_watcher_x86_64
          path: osiris_agent/bin/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graph_watcher_aarch64
          path: osiris_agent/bin/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graph_watcher_x86_64_jazzy
          path: osiris_agent/bin/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graph_watcher_aarch64_jazzy
          path: osiris_agent/bin/

      - name: Commit updated binaries
        run: |
          chmod +x osiris_agent/bin/graph_watcher_x86_64
          chmod +x osiris_agent/bin/graph_watcher_aarch64
          chmod +x osiris_agent/bin/graph_watcher_x86_64_jazzy
          chmod +x osiris_agent/bin/graph_watcher_aarch64_jazzy
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add osiris_agent/bin/graph_watcher_x86_64 \
                  osiris_agent/bin/graph_watcher_aarch64 \
                  osiris_agent/bin/graph_watcher_x86_64_jazzy \
                  osiris_agent/bin/graph_watcher_aarch64_jazzy
          git diff --staged --quiet || \
            git commit -m "build: update graph_watcher binaries [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
